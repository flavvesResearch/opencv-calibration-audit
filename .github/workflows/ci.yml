name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dev tools
        run: python -m pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run Mypy
        run: mypy .

      - name: Run tests
        run: pytest --cov=calibration_audit --cov-report=term-missing --cov-fail-under=85

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dev tools
        run: python -m pip install -e .[dev]

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/calibration-audit-wheel-test
          /tmp/calibration-audit-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/calibration-audit-wheel-test/bin/calibration-audit --version

  platform-smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and smoke test
        run: |
          python -m pip install -e ".[dev]"
          calibration-audit --version
