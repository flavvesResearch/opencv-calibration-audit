name: Auto Tag Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    name: Create release tag and GitHub release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          version=$(python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          text = Path('pyproject.toml').read_text()
          match = re.search(r'^version = "(\d+\.\d+\.\d+)"$', text, re.M)

          if match is None:
              raise SystemExit('version not found')

          print(f"{match.group(1)}.post{os.environ['RUN_NUMBER']}")
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}

      - name: Check whether tag already exists
        id: tag_check
        run: |
          tag_name="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${tag_name}" | grep -q "${tag_name}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: ${{ steps.tag_check.outputs.exists == 'false' }}
        run: |
          tag_name="${{ steps.version.outputs.tag_name }}"
          git tag -a "$tag_name" -m "Release $tag_name"
          git push origin "$tag_name"

      - name: Derive release version from tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"].lstrip("v")
          path = Path("pyproject.toml")
          text = path.read_text()
          updated = re.sub(r'^version = ".*"$', f'version = "{version}"', text, count=1, flags=re.M)

          if updated == text:
              raise SystemExit("version line not updated")

          path.write_text(updated)
          PY
        env:
          VERSION: ${{ steps.version.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dev tools
        run: python -m pip install -e .[dev]

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Smoke test CLI version output
        run: calibration-audit --version

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          files: |
            dist/*
