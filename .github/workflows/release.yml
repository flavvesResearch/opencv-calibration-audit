name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Tag, release, and publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: pypi
      url: https://pypi.org/p/opencv-calibration-audit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          event_name = os.environ["GITHUB_EVENT_NAME"]
          ref_name = os.environ["GITHUB_REF_NAME"]

          if event_name == "push" and ref_name.startswith("v"):
              tag_name = ref_name
              version = tag_name.removeprefix("v")
          else:
              text = Path("pyproject.toml").read_text()
              match = re.search(r'^version = "(\d+\.\d+\.\d+)"$', text, re.M)

              if match is None:
                  raise SystemExit("version not found")

              version = match.group(1)
              tag_name = f"v{version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag_name={tag_name}\n")
          PY
      - name: Check whether tag already exists
        id: tag_check
        run: |
          tag_name="${{ steps.version.outputs.tag_name }}"
          if git ls-remote --tags origin "refs/tags/${tag_name}" | grep -q "${tag_name}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: ${{ github.event_name != 'push' && steps.tag_check.outputs.exists == 'false' }}
        run: |
          tag_name="${{ steps.version.outputs.tag_name }}"
          git tag "$tag_name"
          git push origin "$tag_name"

      - name: Apply release version to package metadata
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          text = path.read_text()
          updated = re.sub(r'^version = ".*"$', f'version = "{version}"', text, count=1, flags=re.M)

          if updated == text:
              raise SystemExit("version line not updated")

          path.write_text(updated)
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Set up Python
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: python -m pip install --upgrade pip

      - name: Install package and dev tools
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: python -m pip install -e .[dev]

      - name: Run Ruff
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: ruff check .

      - name: Run Mypy
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: mypy .

      - name: Run tests
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: pytest --cov=calibration_audit --cov-report=term-missing

      - name: Build distribution artifacts
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: python -m build

      - name: Check distribution metadata
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: twine check dist/*

      - name: Smoke test CLI version output
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        run: calibration-audit --version

      - name: Check whether GitHub release already exists
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        id: release_check
        run: |
          if gh release view "${{ steps.version.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        if: ${{ (github.event_name == 'push' || steps.tag_check.outputs.exists == 'false') && steps.release_check.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          generate_release_notes: true
          files: |
            dist/*

      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' || steps.tag_check.outputs.exists == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
