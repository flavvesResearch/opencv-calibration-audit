name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, release, and publish
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/opencv-calibration-audit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release version from tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          version = os.environ['VERSION'].lstrip('v')
          path = Path('pyproject.toml')
          text = path.read_text()
          updated = re.sub(r'^version = ".*"$', f'version = "{version}"', text, count=1, flags=re.M)

          if updated == text:
              raise SystemExit('version line not updated')

          path.write_text(updated)
          PY
        env:
          VERSION: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dev tools
        run: python -m pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run Mypy
        run: mypy .

      - name: Run tests
        run: pytest --cov=calibration_audit --cov-report=term-missing

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Smoke test CLI version output
        run: calibration-audit --version

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1