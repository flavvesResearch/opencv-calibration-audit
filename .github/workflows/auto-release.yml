name: Auto Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version tag and release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve project version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z._+-]*", version) is None:
              raise SystemExit(f"Unsupported project version: {version!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag=v{version}\n")
          PY

      - name: Create release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "$TAG_NAME is already released; no action is needed."
            exit 0
          fi

          if git rev-parse --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$tag_sha" != "$HEAD_SHA" ]; then
              echo "$TAG_NAME already points to $tag_sha instead of $HEAD_SHA." >&2
              exit 1
            fi
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes
          else
            gh release create "$TAG_NAME" \
              --target "$HEAD_SHA" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

          gh workflow run release.yml \
            --ref main \
            --field tag="$TAG_NAME"
