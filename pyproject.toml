[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-calibration-audit"
version = "0.2.2"
description = "Validate OpenCV checkerboard camera-calibration datasets for blur, duplicates, coverage, pose diversity, and reprojection error."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "opencv",
    "camera calibration",
    "checkerboard",
    "camera intrinsics",
    "reprojection error",
    "dataset quality",
    "computer vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jinja2>=3.1",
    "numpy>=1.23",
    "opencv-python-headless>=4.11",
    "PyYAML>=5.4",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://flavvesresearch.github.io/opencv-calibration-audit/"
Documentation = "https://flavvesresearch.github.io/opencv-calibration-audit/"
Repository = "https://github.com/flavvesResearch/opencv-calibration-audit"
Changelog = "https://github.com/flavvesResearch/opencv-calibration-audit/blob/main/CHANGELOG.md"
Issues = "https://github.com/flavvesResearch/opencv-calibration-audit/issues"

[project.scripts]
calibration-audit = "calibration_audit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
]
docs = [
    "mkdocs-material>=9.5,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
packages = ["calibration_audit"]
strict = true
exclude = ["tests", "build", "dist"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "--strict-markers"
